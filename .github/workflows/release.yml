name: Build, test, and release preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test, and package
        shell: powershell
        run: .\build.ps1 -Package
      - name: Publish community preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.0 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'v0.1.0 already exists; keep its published assets unchanged.'
            exit 0
          }
          gh release create v0.1.0 `
            dist/G7ProXboxWireless-0.1.0-win-x64.zip `
            dist/G7ProXboxWireless-0.1.0-source.zip `
            dist/SHA256SUMS.txt `
            --target $env:GITHUB_SHA `
            --title 'G7 Pro Xbox Wireless v0.1.0 — Community Preview' `
            --notes-file docs/RELEASE_NOTES.md `
            --prerelease
          if ($LASTEXITCODE) { throw 'Preview release creation failed.' }
